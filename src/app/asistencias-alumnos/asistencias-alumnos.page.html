<ion-menu contentId="main-content">
  <ion-header>
    <ion-toolbar>
      <ion-title>Menu</ion-title>
    </ion-toolbar>
  </ion-header>
  <ion-content>
    <ion-list>
      <ion-item [button]="true" [href]="'/asignaturas-alumnos'">
        <ion-icon name="library-outline" class="ion-margin-end"></ion-icon>
        <ion-label>Mis asignaturas</ion-label>
      </ion-item>
      <ion-item [button]="true" [href]="'/asistencias-alumnos'">
        <ion-icon name="calendar-outline" class="ion-margin-end"></ion-icon>
        <ion-label>Mis asistencias</ion-label>
      </ion-item>
      <ion-item [button]="true" [href]="'/cambiar-clave'">
        <ion-icon name="lock-closed-outline" class="ion-margin-end"></ion-icon>
        <ion-label>Cambiar clave</ion-label>
      </ion-item>
    </ion-list>
  </ion-content>
</ion-menu>
<div class="ion-page" id="main-content">
  <ion-header>
    <ion-toolbar>
      <ion-buttons slot="start">
        <ion-menu-button></ion-menu-button>
      </ion-buttons>
      <ion-label style="font-size: 20px;">Mis Asistencias</ion-label>
      <ion-buttons slot="end">
        <ion-back-button defaultHref="menu-alumno"></ion-back-button>
      </ion-buttons>
    </ion-toolbar>
  </ion-header>
  <ion-content *ngIf="asistencias.length > 0; else noAsistencias">
    <ion-list>
      <ion-item-group *ngFor="let asistencia of asistencias">
        <ion-item button (click)="asistencia.open = !asistencia.open">
          <ion-label>
            <h2>{{ asistencia.nombre_asignatura }}</h2>
            <p>{{ asistencia.codigo_seccion }}</p>
          </ion-label>
          <ion-icon slot="end" [name]="asistencia.open ? 'chevron-down' : 'chevron-forward'"></ion-icon>
        </ion-item>
  
        <ion-list *ngIf="asistencia.open">
          <ion-item *ngFor="let detalle of asistencia.asistencias">
            <ion-label>
              Fecha: {{ detalle.fecha }}
            </ion-label>
            <ion-badge slot="end" [color]="detalle.estado === 'presente' ? 'success' : 'danger'">
              {{ detalle.estado }}
            </ion-badge>
          </ion-item>
        </ion-list>
      </ion-item-group>
    </ion-list>
  </ion-content>
  
  <ng-template #noAsistencias>
    <ion-item>
      <ion-label>No hay asistencias registradas.</ion-label>
    </ion-item>
  </ng-template>
