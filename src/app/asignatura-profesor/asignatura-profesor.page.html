<ion-menu contentId="main-content">
  <ion-header>
    <ion-toolbar>
      <ion-title>Menu</ion-title>
    </ion-toolbar>
  </ion-header>
  <ion-content>
    <ion-list>
      <ion-item [button]="true" [href]="'/asignatura-profesor'">
        <ion-icon name="library-outline" class="ion-margin-end"></ion-icon>
        <ion-label>Mis asignaturas</ion-label>
      </ion-item>
      <ion-item [button]="true" [href]="'/asistencia-profesor'">
        <ion-icon name="calendar-outline" class="ion-margin-end"></ion-icon>
        <ion-label>Mis asistencias</ion-label>
      </ion-item>
      <ion-item [button]="true" [href]="'/cambiar-clave-profesor'">
        <ion-icon name="lock-closed-outline" class="ion-margin-end"></ion-icon>
        <ion-label>Cambiar clave</ion-label>
      </ion-item>
    </ion-list>
  </ion-content>
</ion-menu>
<div class="ion-page" id="main-content">
  <ion-header>
    <ion-toolbar>
      <ion-buttons slot="start">
        <ion-menu-button></ion-menu-button>
      </ion-buttons>
      <ion-label style="font-size: 20px;">Mis Asignaturas</ion-label>
      <ion-buttons slot="end">
        <ion-back-button defaultHref="menu-profesor"></ion-back-button>
      </ion-buttons>
    </ion-toolbar>
  </ion-header>
  <ion-content class="ion-padding"><div *ngIf="subjectsWithDetails.length > 0; else noSubjects">
    <div *ngFor="let subject of subjectsWithDetails">
      <ion-item>
        <ion-label>
          <strong>{{ subject.nombre }}</strong><br>
          <ion-text>{{ subject.codigo }}</ion-text><br>
        </ion-label>
      </ion-item>

      <div *ngIf="subject.secciones && subject.secciones.length > 0">
        <div *ngFor="let seccion of subject.secciones">
          <ion-item lines="none">
            <ion-label>
              <p><strong>Código de sección:</strong> {{ seccion.codigo_seccion }}</p>
              <ion-note color="medium">
                <p><strong>Horario:</strong></p>
                <ul>
                  <li *ngFor="let horario of seccion.horario">
                    {{ horario.dia }} de {{ horario.inicio }} a {{ horario.fin }}
                  </li>
                </ul>
              </ion-note>
            </ion-label>
          </ion-item>
        </div>
      </div>
    </div>
  </div>
  
  <ng-template #noSubjects>
    <p>No se encontraron asignaturas para mostrar.</p>
  </ng-template>
  </ion-content>
</div>
